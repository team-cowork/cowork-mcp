language: ko
minSeverity: minor
maxInlineComments: 25

exclude:
  - 'node_modules/**'
  - 'dist/**'
  - 'package-lock.json'

maxFiles: 60
maxFileChars: 24000
maxPromptChars: 140000
autoReview: true
triggerPrefix: '/review'

sandrone:
  language: ko
  tone: sandrone
  minSeverity: nit
  maxInlineComments: 25
  autoReview: true
  autoReviewOnPush: false
  summaryPlacement: new-comment
  threadReply: true
  emoji: false
  maxReviewBatches: 4
  allowStrongTone: true
  progressMessageTheme: sandrone
